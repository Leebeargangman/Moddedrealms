# The story is done in order. "talk" is what the quest giver says when the chapter starts.
story:
  - id: arrival
    name: "A New Arrival"
    icon: OAK_SAPLING
    giver: elder
    description: "Speak with Elder Rowan at the fountain."
    objective: {type: TALK, target: elder, amount: 1}
    rewards: ["money:150", "key:common:1"]
  - id: tools
    name: "Tools of the Trade"
    icon: IRON_PICKAXE
    giver: elder
    talk:
      - "Every legend in this land started with a humble pickaxe."
      - "Craft one, any kind will do, and you'll be ready for what lies beyond the walls."
    description: "Craft any pickaxe."
    objective: {type: CRAFT, target: "*_PICKAXE", amount: 1}
    rewards: ["money:100", "item:TORCH:16"]
  - id: wilds
    name: "Into the Wilds"
    icon: COMPASS
    giver: captain
    talk:
      - "Spawn's too crowded to build a life in. Want to see the wild lands?"
      - "Type <white>/warp</white> and I'll send you somewhere safe, far from here."
    description: "Use /warp to travel to the wilds."
    objective: {type: COMMAND, target: warp, amount: 1}
    rewards: ["money:150", "item:BREAD:8"]
  - id: envoy
    name: "The Colonies"
    icon: BELL
    giver: envoy
    talk:
      - "You won't be alone out there. Colonies of settlers farm, mine and trade across this land."
      - "Some are friendly. Some go to war. Find their citizens and make yourself known."
    description: "Come back to the Colony Envoy at spawn after warping."
    objective: {type: TALK, target: envoy, amount: 1}
    rewards: ["money:150", "key:colony:1"]
  - id: iron
    name: "Iron Will"
    icon: RAW_IRON
    giver: elder
    talk:
      - "The colonies respect strength. Strength needs iron."
      - "Mine sixteen iron ore and forge yourself proper gear."
    description: "Mine iron ore."
    objective: {type: BREAK, target: "IRON_ORE,DEEPSLATE_IRON_ORE", amount: 16}
    rewards: ["money:300", "key:common:1"]
  - id: arcane
    name: "The Arcane"
    icon: ENCHANTED_BOOK
    giver: enchanter
    talk:
      - "Mmm. I sense untapped potential in you."
      - "This land hides enchantments no table in the old world knew. Enchant something, and see."
    description: "Enchant an item."
    objective: {type: ENCHANT, target: ANY, amount: 1}
    rewards: ["money:250", "key:rare:1"]
  - id: hunter
    name: "Monster Hunter"
    icon: IRON_SWORD
    giver: herald
    talk:
      - "Nights grow darker. Something stirs in the depths."
      - "Prove you can handle the small fry first: twenty-five hostile mobs."
    description: "Slay hostile mobs."
    objective: {type: KILL, target: HOSTILE, amount: 25}
    rewards: ["money:400", "key:rare:1"]
  - id: warning
    name: "The Herald's Warning"
    icon: WITHER_SKELETON_SKULL
    giver: herald
    talk:
      - "You did well. Now listen closely."
      - "Ancient bosses roam this world: cursed knights, serpents of the deep, and worse."
      - "And if you ever see a figure with white eyes watching from the trees... don't follow it."
    description: "Hear the Herald out."
    objective: {type: TALK, target: herald, amount: 1}
    rewards: ["money:200"]
  - id: first_boss
    name: "First Blood"
    icon: NETHERITE_SWORD
    giver: herald
    talk:
      - "Find a boss. Bring friends. Use <white>/boss</white> to learn what's out there."
      - "Come back a hero, or don't come back at all."
    description: "Defeat any MythicDepths boss."
    objective: {type: KILL_BOSS, target: ANY, amount: 1}
    rewards: ["money:2000", "key:mythic:1"]
  - id: legend
    name: "Legend of Moddedrealms"
    icon: NETHER_STAR
    giver: elder
    talk:
      - "The whole square speaks of you now."
      - "Five bosses felled, and your name will be carved in this fountain's stone."
    description: "Defeat five MythicDepths bosses."
    objective: {type: KILL_BOSS, target: ANY, amount: 5}
    rewards: ["money:10000", "key:mythic:3", "cmd:broadcast {player} has become a Legend of Moddedrealms!"]
