# ============================================================================
#  Quests
#
#  objective types:
#    BREAK / PLACE     target: materials, comma separated, * wildcards (e.g. "*_LOG")
#    HARVEST           fully grown crops broken. target: materials or ANY
#    KILL              target: entity types, or HOSTILE / ANIMAL / ANY
#    KILL_BOSS         a MythicDepths boss. target: ANY or a boss id (e.g. cursed_knight)
#    FISH, BREED, TAME, ENCHANT, EAT   target: ANY (or materials / entity types)
#    CRAFT / SMELT     target: materials of the result
#    TRADE             villager / wandering trader trades. target: ANY
#    COLONY_MEET       right-click different ColonySMP citizens
#    WALK              blocks travelled on foot
#    PLAYTIME          minutes online
#    COMMAND           run a command. target: the command name (e.g. warp)
#    TALK              talk to one of our NPCs. target: npc id
#
#  rewards: money:<n>, key:<crate>:<n>, xp:<n>, item:<MATERIAL>:<n>, cmd:<console command with {player}>
# ============================================================================

