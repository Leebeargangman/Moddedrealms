name: ModdedrealmsSMP
version: '${project.version}'
main: net.moddedrealms.smp.SmpPlugin
api-version: '1.21'
author: Moddedrealms
description: NPC-driven survival - quest givers, story, quests, crates, the spawn plaza, and a town with police, townsfolk and a jail.
softdepend: [Essentials, MythicDepths, ColonySMP]
commands:
  quests:
    description: Open your quests.
    aliases: [quest, q, dailies]
    permission: mrsmp.quests
  crates:
    description: Open your crates and see your keys.
    aliases: [keys, crate]
    permission: mrsmp.quests
  mrsmp:
    description: ModdedrealmsSMP admin and NPC dialogue.
    usage: /mrsmp <reload|spawn|talk|quest>
    permission: mrsmp.use
  mrnpc:
    description: Manage the server's NPCs.
    usage: /mrnpc <list|create|move|skin|name|title|action|remove|tp>
    permission: mrsmp.admin
  mrtown:
    description: Town admin - police, townsfolk, reputation and the jail.
    usage: /mrtown <status|spawn|wanted|pardon|release|arrest|rep|jail|toggle|clear>
    permission: mrsmp.admin
  rep:
    description: Your standing in town, wanted level and record.
    aliases: [reputation, record]
    permission: mrsmp.quests
  bail:
    description: Pay to get out of jail early.
    permission: mrsmp.quests
  surrender:
    description: Give yourself up to a nearby officer.
    permission: mrsmp.quests
  deputy:
    description: Join or leave the Town Watch as a deputy.
    permission: mrsmp.quests
  wanted:
    description: Who the police are after.
    permission: mrsmp.quests
permissions:
  mrsmp.quests:
    default: true
  mrsmp.use:
    description: Talking to NPCs (the NPCs run /mrsmp talk for the player).
    default: true
  mrsmp.admin:
    default: op
  mrsmp.lawless:
    description: The police ignore this player (for staff who are building or testing). Not given to ops.
    default: false
