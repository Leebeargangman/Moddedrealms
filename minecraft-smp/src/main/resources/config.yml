# ============================================================================
#  ModdedrealmsSMP
# ============================================================================

# Lets root/AMP send console commands by appending lines to
# plugins/ModdedrealmsSMP/console.in (checked every second). Only people who
# can already write the server's files can use it.
console-bridge: true

rewards:
  # How reward lines are turned into console commands. {player} {amount} {crate}
  money-command: "eco give {player} {amount}"
  xp-command: "xp add {player} {amount} points"

# Everyone within 48 blocks when a MythicDepths boss dies gets these.
boss-kill-rewards: ["key:mythic:1", "money:1000"]

quests:
  daily-count: 3
  weekly-count: 2
  # Bonus for finishing every daily quest N days in a row.
  streak-rewards:
    3: ["key:rare:1", "money:500"]
    7: ["key:mythic:1", "money:1500"]
    14: ["key:mythic:2", "money:4000"]

playtime:
  # Every N minutes online a player gets these rewards.
  every-minutes: 60
  rewards: ["key:common:1", "money:100"]
  message: "<gold>⌛ <yellow>Thanks for playing! You earned <white><rewards></white> for an hour online."

welcome:
  enabled: true
  title: "<gradient:#f6d365:#fda085><bold>Moddedrealms</bold></gradient>"
  subtitle: "<gray>A living world of colonies, bosses and quests"
  first-join-message:
    - ""
    - "<gold><bold>Welcome to Moddedrealms, <white><player></white>!</bold>"
    - "<gray>Talk to <yellow>Elder Rowan</yellow> by the fountain to begin your story."
    - "<gray>Quests: <white>/quests</white>  ·  Random wild spot: <white>/warp</white>  ·  Bosses: <white>/boss</white>"
    - ""
  join-message:
    - "<gray>Welcome back, <white><player></white>! <yellow>/quests</yellow> has your daily quests."

# NPCs turn to look at players within this many blocks.
npc-look-radius: 8

# Graves: when a player dies their drops (and XP) wait in a player-head grave where they fell, with a floating
# label. Right-click it to get everything back in the same slots. Skipped when keepInventory is on.
graves:
  enabled: true
  # Only the owner (and staff) can open a grave for this long; then anyone can. 0 = owner only, forever.
  unlock-minutes: 15
  # A grave this old spills its items on the ground (only while its chunk is loaded). 0 = never.
  expire-minutes: 0
  store-xp: true
  hologram: true
  # How far from the death spot to look for room for the head (1-8).
  search-radius: 4
  disabled-worlds: []

# ============================================================================
#  Town: police, townsfolk, reputation and the jail
# ============================================================================
town:
  enabled: true
  world: world
  # The fountain. Police patrol within police-radius of it, townsfolk wander within townsfolk-radius.
  center-x: -394
  center-z: 463
  police-radius: 500
  townsfolk-radius: 160

  officers-per-player: 2        # around each player in the police zone (+1 per wanted star, up to +3)
  max-officers: 24
  townsfolk-per-player: 3       # one fewer at night
  max-townsfolk: 16
  officer-health: 30
  officer-damage: 4             # per hit, +0.5 per wanted star. The hit that would kill arrests instead ("busted").
  officer-speed: 0.25
  officer-uniform-color: "#1F2A44"
  officer-sight: 24             # officers see crimes this far away (with line of sight)
  townsfolk-health: 12
  witness-range: 16             # townsfolk and plaza NPCs report crimes they see this close
  hostile-at-stars: 3           # from this many stars officers use force straight away
  wanted-decay-seconds: 60      # lose a star every N seconds no officer can see you
  self-defence-seconds: 10      # hitting back within this long is not assault
  bodycam: true                 # save a ModdedrealmsGuard replay of every arrest

  arrest:
    seconds-per-star: 60
    max-seconds: 300
    busted-extra-seconds: 60
    fine-per-star: 100
    bail-per-second: 4

  # Visible in hand = officers search you. Confiscated; the first time is only a warning.
  contraband: [TNT, TNT_MINECART, END_CRYSTAL]
  contraband-fine: 50
  random-search-chance: 0.006   # per half-second near an officer, at most once per random-search-minutes
  random-search-minutes: 15

  # Wanted stars when seen, reputation lost either way.
  crimes:
    assault: {stars: 2, reputation: 15}
    murder: {stars: 4, reputation: 50}
    robbery: {stars: 2, reputation: 20}
    pickpocket: {stars: 1, reputation: 8}
    arson: {stars: 2, reputation: 15}
    explosives: {stars: 2, reputation: 20}
    pet-killing: {stars: 2, reputation: 25}
    assault-npc: {stars: 1, reputation: 10}
    manslaughter: {stars: 3, reputation: 40}
    resisting: {stars: 1, reputation: 10}
    assault-officer: {stars: 2, reputation: 25}
    cop-killing: {stars: 5, reputation: 80}

  reputation:
    hero: 300
    respected: 100
    rogue: -50
    outlaw: -300
    daily-quest: 3
    weekly-quest: 8
    story-chapter: 10
    boss-kill: 5
    catch-thief: 15
    help-traveller: 3

  deputy:
    reward-per-star: 75
    reputation: 10

  # Robbing players: sneak + right-click someone with an empty hand, inside the police zone.
  rob-players: true
  rob:
    chance-behind: 0.5
    chance-front: 0.1
    fraction: 0.05
    max: 500
    min-balance: 50
    cooldown-minutes: 5
    victim-protection-minutes: 20

  # Pickpocketing townsfolk: sneak + right-click with an empty hand.
  pickpocket:
    chance-behind: 0.75
    chance-front: 0.3
    max-per-hour: 8
    trinket-chance: 30

  # NPC pickpockets who rob players (only coins, never items).
  pickpockets: true
  thief:
    steal-fraction: 0.03
    max-steal: 150
    min-balance: 100
    min-playtime-minutes: 30
    victim-cooldown-minutes: 30
    escape-seconds: 40
    catch-reward: 25

  fence:
    disguise-price: 750
    key-price: 1500
    key-crate: blackmarket

  # material:amount:price, or key:<crate>:<amount>:<price>. Each merchant brings merchant-offer-count of these.
  merchant-offer-count: 5
  merchant-offers:
    - "GOLDEN_CARROT:16:150"
    - "COOKED_BEEF:32:120"
    - "EXPERIENCE_BOTTLE:16:400"
    - "NAME_TAG:1:300"
    - "SADDLE:1:350"
    - "FIREWORK_ROCKET:32:250"
    - "ENDER_PEARL:8:400"
    - "BOOKSHELF:8:250"
    - "LEAD:2:150"
    - "SPYGLASS:1:200"
    - "HONEY_BOTTLE:8:160"
    - "GLOW_BERRIES:32:150"
    - "AMETHYST_SHARD:16:200"
    - "SHULKER_SHELL:2:2500"
    - "key:common:1:750"

  # material:name:value (what the Fence pays)
  stolen-goods:
    - "CLOCK:Silver Pocket Watch:120"
    - "GOLD_NUGGET:Jewelled Ring:150"
    - "PAPER:Love Letter:40"
    - "EMERALD:Emerald Brooch:200"
    - "RABBIT_FOOT:Lucky Rabbit's Foot:90"
    - "AMETHYST_SHARD:Amethyst Earring:110"
    - "BOOK:Someone's Diary:60"

  gossip:
    - "They say the deeper you dig, the angrier the bosses get. <white>/boss help</white> if you dare."
    - "Colonies pay well for a helping hand. Envoy Mira by the fountain knows more."
    - "Keep your purse close in the crowds. There are pickpockets about."
    - "The Town Watch don't take kindly to explosives anywhere near the fountain."
    - "If the watch is after you, crouch next to an officer. Running only makes it worse."
    - "A shady figure walks the streets after dark... only talks to the wrong sort, I hear."
    - "Help a hungry traveller and the whole town will think better of you."
    - "Heroes get the best prices from merchants. Do some quests, earn some respect!"
    - "The watch pays deputies for every outlaw they bring in. You have to be well respected first."
    - "The jail's just south-east of the fountain. I hope you never see the inside."
    - "Bandits out past the edge of town, I hear. There's good money on their heads, though."
    - "Seen someone with a bounty? /tip the watch, or bring them in yourself and keep the lot."
    - "Cross the watch badly enough and the Bureau takes over. They say you're only safe 2000 blocks out."
    - "They say a third of the watch can be bought. The other two thirds take it very personally."
    - "Nobody's robbed the bank in a while... not that I'm suggesting anything."
    - "There's a casino out in the snow, they say. Under an old hunting shack. You didn't hear it from me."
    - "The Crimson Vipers and the Iron Jackals hate each other more than they hate us. Pick a side, maybe."
    - "A treasury wagon goes from the bank to the station now and then. Heavily guarded, of course."

  # ---- Bounties: the town pays per wanted star; players can add more with /bounty.
  bounty:
    per-star: 250
    tip-share: 0.5            # /tip that leads to an arrest within 10 minutes pays this share
    announce-from-stars: 2
    min-player-bounty: 100
    citizens-arrest: true     # the blow that would kill a wanted player arrests them instead (within the Bureau's reach)

  # ---- Players in the Town Watch (/police join at the station, Respected or better)
  police:
    pay-per-star: 75          # per arrest, x1.25 per rank: Cadet, Officer (5 arrests), Sergeant (15), Captain (30), Chief (50)
    reputation-per-arrest: 10
    salary: 50                # every salary-minutes on duty inside the police zone, also x rank
    salary-minutes: 10

  officers-fight-mobs: true
  officer-mob-range: 14
  officer-mob-damage: 7

  # ---- Bribes: this share of officers take the money (per star) and forget you. The rest add a charge.
  bribe:
    chance: 0.3
    per-star: 300

  # ---- Bandits roam the wilds between min- and max-distance from the fountain.
  bandits:
    enabled: true
    min-distance: 170
    max-distance: 1500
    max: 8
    chance-day: 0.25          # per player every 30 seconds, when no bandit is near them
    chance-night: 0.5
    health: 24                # +6 per star
    damage: 3                 # +0.5 per star
    steal-per-hit: 40         # coins (1% of balance, up to this); given back when the bandit is caught
    bounty-per-star: 200

  # ---- The Bureau opens a case at from-stars and tracks you within reach of the fountain for case-days Minecraft days.
  bureau:
    enabled: true
    from-stars: 3
    reach: 2000
    case-days: 3
    agents: 3                 # per ambush, +1 at 4+ stars
    ambush-minutes-min: 4
    ambush-minutes-extra: 4
    agent-minutes: 4          # agents give up after this long
    health: 40
    damage: 5
    speed: 0.27

  # ---- Community service instead of jail (offered for a minute after an arrest, up to max-stars).
  service:
    enabled: true
    max-stars: 3
    seconds-per-piece: 12     # one piece of litter per 12 s of sentence (at least 5)
    radius: 30
    reputation: 5

  # ---- The bank (/mrtown bank build). One robbery per cooldown.
  bank:
    cooldown-minutes: 180
    min-players-online: 2
    crack-seconds: 60         # robber-seconds at the vault (up to 3 robbers work 3x faster)
    loot-min: 4000
    loot-max: 9000
    gold-bars: 2
    gold-bar-value: 400

  # ---- The underground casino (/mrtown casino build). Raids while players are inside.
  casino:
    slot-price: 50
    slot-price-high: 250
    house-cut: 0.05             # dice: share of the pot the house keeps
    roulette-seconds: 30
    patrons: 8
    patrons-who-fight: 0.5      # in a raid, the rest run for the exits
    raid-minutes-min: 8
    raid-minutes-max: 20
    raid-seconds: 180
    raid-officers-max: 8

  # ---- Player gangs (/gang).
  gangs:
    create-cost: 5000
    max-members: 10
    crime-tax: 0.1              # share of members' crime income that goes to the gang bank
    claim-cost: 1000
    no-claim-radius: 200
    income-per-chunk: 25
    income-minutes: 60
    war-cost: 2000

  # ---- NPC gangs in the wilds (Crimson Vipers, Iron Jackals).
  npc-gangs:
    enabled: true
    min-distance: 220
    max-distance: 1500
    max: 12
    chance: 0.2
    strength: 25                # members to take down to wipe a gang out
    respawn-hours: 48
    wipe-reward: 5000
    bounty: 100
    health: 30
    damage: 3.5
    ally-at: 50

  # ---- Heists (planned with the Planner in the casino).
  heists:
    plan-cost: 1000
    min-crew: 2
    max-crew: 4
    alarm-seconds: 20
    alarm-delay-seconds: 60     # how long after the drill starts the police notice, if the alarm was cut
    drill-seconds: 120          # crew-seconds at the vault (up to 3 at once)
    bank-bags: 3
    bank-bag-value: 2500
    wagon-bags: 2
    wagon-bag-value: 2000
    courier-health: 60
    getaway-min: 560
    stage-minutes: 20
    bank-cooldown-minutes: 360
    wagon-cooldown-minutes: 180

  # ---- Prison breaks (bolt cutters on a cell's back window, generated jail only).
  prison-break:
    cutter-price: 1500
    seconds: 20
    open-seconds: 40

  # ---- Meadowbrook (/mrtown meadowbrook build) and its plots.
  meadowbrook:
    police-radius: 200
    town-radius: 85
  plots:
    max-per-player: 3
    sell-back: 0.5
    business-built-price: 60000
    business-built-rent: 1500
    business-bare-price: 25000
    business-bare-rent: 600
    home-built-price: 35000
    home-built-rent: 800
    home-bare-price: 15000
    home-bare-rent: 300
    industry-built-price: 50000
    industry-built-rent: 1200
    industry-bare-price: 20000
    industry-bare-rent: 500

  # ---- The Meadowbrook Line (/mrtown railway build <x> <southZ> <northZ>).
  railway:
    single: 200
    return: 350
    day-pass: 600
    first-discount: 0.6          # first ticket ever bought
    board-seconds: 45
    speed: 1.0                   # blocks per tick at full speed
    max-cars: 10
    npc-passengers: 3

  # ---- Businesses (/business) and jobs (/jobs). The economy runs a cycle every cycle-seconds.
  business:
    cycle-seconds: 300
    demand: 1.0                  # multiplies how much townspeople buy (more players online = more demand too)
    tax: 0.05                    # of revenue, to the town treasury
    npc-wage: 15                 # per NPC staff per cycle (each adds 25% output)
    town-wage: 25                # per task for jobs at town businesses
    upkeep-per-level: 25
    raid-chance: 0.06            # per cycle, illegal businesses
    dominance-share: 0.4         # a player business above this share of a market...
    rival-after-cycles: 6        # ...for this many cycles attracts a rival company
    delivery-seconds: 300
    max-staff-walkers: 16
    max-customers: 8

  # ---- Bank loans (/loan, from Banker Oakes or the Old Town banker).
  loans:
    base-limit: 10000
    per-reputation: 100          # extra limit per reputation point
    max: 500000
    interest: 0.15
    days: 7                      # repaid in daily instalments

  names:
    townsfolk: [Ada, Ben, Cora, Dell, Edda, Finn, Greta, Hugo, Ivy, Jory, Kit, Lark, Milo, Nell, Otto, Pia, Quinn, Rosa, Sid, Tess, Ulla, Vic, Wren, Yara, Bram, Elsie, Ned, Moll]
    officers: [Reyes, Grant, Holloway, Marsh, Quill, Barrow, Finch, Stone, Avery, Doyle, Kerr, Lowe, Thorne, Vance, Wilde, Brennan]
    bandits: [Grim, Scar, Rook, Vex, Jack, Crow, Mags, Snake, Red, Ash, Dutch, Viper, Slim, Patch]
    agents: [Cole, Hart, Mercer, Lang, Shaw, Black, Price, Reed, Kade, Voss]

  # What prisoners may still type.
  jail-allowed-commands: [bail, service, rep, wanted, bounties, msg, tell, w, r, reply, m, helpop, report, rules, list, mail, surrender]
