# ColonySMP 2 configuration.
# Times are real minutes/seconds unless they say "days" or "hours", which are Minecraft days (20 real minutes)
# and Minecraft hours (50 real seconds). Reload with /colony admin reload.

general:
  autosave-minutes: 5
  # Database backups kept in plugins/ColonySMP/backups (one is made at every start).
  backups-to-keep: 5

colonies:
  # How many colonies one player may belong to.
  max-per-player: 1
  # Chunks claimed around the Town Hall Core when a colony is founded (1 = a 3x3 square).
  starting-radius: 1
  # Free chunks required between two colonies.
  chunk-gap: 2
  # Most chunks a colony may hold: base + per settlement level above 1, up to the maximum.
  base-chunks: 12
  chunks-per-level: 10
  max-chunks: 120
  # Claiming a chunk costs this, plus the step for every chunk already held.
  claim-cost: 25
  claim-cost-step: 5
  # Worlds colonies may be founded in (empty: all).
  worlds: []
  # Founding grace: for this many days (Minecraft days, counted only while a member is online) nobody in a new
  # colony can die of hunger, illness or monsters, and nobody emigrates. 0 turns it off.
  founding-grace-days: 4
  # A colony nobody lives in any more can call a new band of settlers (with provisions) with /colony resettle,
  # once every this many days.
  resettle-cooldown-days: 7
  # Places no colony may be founded or claim land: "world,x,z,radius,name". Other plugins (ModdedrealmsSMP's
  # towns) add their own through the API.
  no-found-zones: []

protection:
  # Players can't fight each other on colony land unless their colonies are at war.
  block-pvp: true
  protect-explosions: true
  protect-fire: true
  protect-farmland: true
  enter-messages: true
  # Peace shields: no war can be declared on a colony while it has one.
  new-colony-shield-hours: 72
  after-defeat-shield-hours: 24

citizens:
  # The first settlers of a new colony, by job.
  starting-jobs: [FARMER, BUILDER, FORESTER, UNEMPLOYED]
  # The provisions they bring to colony storage, to last until the first harvest.
  starting-goods: ["BREAD:40", "WHEAT_SEEDS:16", "OAK_SAPLING:4"]
  # Most citizens one colony may have.
  max-population: 150
  # Citizens walking around as villagers at once (the rest are simulated without a body).
  max-bodies-per-colony: 60
  max-bodies-total: 300
  health: 20
  walk-speed: 0.13
  run-speed: 0.21
  # Farmers, foresters, miners and fishers need their tool (hoe, axe, pickaxe, rod) to work at all. Tools never
  # appear from nowhere: put them in colony storage, sneak + right-click a citizen with one to hand it over, or
  # have a blacksmith or workshop make them. Better tools work faster and bring in more (wood < stone < iron <
  # diamond < netherite; Efficiency and Fortune count too). With this off, bare hands work at bare-hands-speed.
  require-tools: true
  bare-hands-speed: 0.3
  # Animal keepers lead in wild cows, sheep, pigs, chickens, rabbits and goats (wild horses for the stables) from
  # up to this many blocks around their pen while it holds fewer than its herd size of that kind (0: never). They
  # use a lead from colony storage (it isn't used up), or failing that coax the animal along with its feed.
  # Animals that are named, tamed, on a lead or already counted in a pen are never taken.
  herd-gather-range: 32
  # Also take wild animals from unclaimed land (never from another colony's land, and never one standing by a
  # fence or wall, which is likely someone's farm). Off: only from the colony's own land.
  herd-gather-wilds: true
  # How far (blocks) beyond the colony's land citizens go for trees.
  work-margin: 24
  # Seconds per action for the world jobs (at normal efficiency).
  farm-interval: 1.5
  chop-interval: 2.0
  mine-interval: 2.5
  build-interval: 1.2
  fish-interval: 12
  station-interval: 2.0
  # A citizen stuck this long is moved to where it was going (sooner if no player is watching).
  stuck-teleport-seconds: 20
  stuck-force-seconds: 60
  # Citizens speak to members who walk past (what's stopping their work, what they need, the news).
  # Seconds between remarks per player; 0 turns it off. A player can mute it with /colony chatter off.
  chatter-seconds: 45

life:
  # Ages in Minecraft days.
  adult-age-days: 5
  elder-age-days: 60
  max-age-days: 90
  # Daily chance a couple with a home has a child (if the colony has room, food and is content).
  birth-chance: 0.25
  birth-food-reserve-days: 3
  birth-min-mood: 45
  # Friendship needed before two citizens become partners.
  partner-affinity: 60

needs:
  # Satiety (0-100) lost per hour awake / asleep.
  hunger-awake: 3.5
  hunger-asleep: 1.5
  # Citizens eat when satiety falls below eat-below, until eat-until.
  eat-below: 55
  eat-until: 92
  # Satiety gained per hunger point of food (bread is 5 points).
  satiety-per-point: 6
  # Energy (0-100) lost per hour awake, gained per hour asleep in a bed / without one.
  energy-awake: 5
  energy-bed: 12
  energy-no-bed: 6
  tired: 30
  exhausted: 12
  # Health lost per hour while starving; healed per hour when fed / sleeping in a bed.
  starve-damage: 1.5
  heal-fed: 0.4
  heal-bed: 1.5
  social-decay: 2
  social-gain: 8
  # Heavy work (mining, building, fighting) uses this much more food and energy.
  heavy-work-factor: 1.3
  # Food citizens never eat.
  never-eat: [ROTTEN_FLESH, SPIDER_EYE, POISONOUS_POTATO, PUFFERFISH, CHORUS_FRUIT, SUSPICIOUS_STEW]
  # Time of day citizens go to bed (ticks; 13500 is dusk).
  bedtime: 13500

education:
  # Education points per lesson (every 30 seconds in a school with a teacher).
  per-lesson: 1.5
  child-multiplier: 2
  # A book in the school that day makes lessons better.
  book-multiplier: 1.5
  # Education of adult newcomers.
  starting-min: 10
  starting-max: 45

economy:
  # There is no money. A colony's treasury is the valuables in its storage: iron, gold and copper (nuggets,
  # ingots, blocks), emeralds, diamonds and netherite ingots. Every cost below is a worth measured against the
  # iron nugget (1): an iron ingot is 9, a gold ingot 18, an emerald 10, a diamond 60 (see prices). Payments take
  # those items, breaking ingots and blocks into change; income arrives as a mix of metal and gems.
  # Worth of valuables a new colony starts with.
  starting-treasury: 150
  # Recruiting a settler from the Town Hall (more as the colony grows).
  recruit-cost: 30
  wage-multiplier: 1
  upkeep-multiplier: 1
  # Market: the gap between buying and selling prices, and how fast prices return to normal.
  market-spread: 0.25
  market-recovery-per-hour: 0.02
  meal-price-multiplier: 1
  # Players pay this much over market price at a colony's Market.
  shop-markup: 1.2
  # Base values of goods (anything not listed gets a value from its kind).
  prices:
    wheat: 1
    bread: 4
    iron_nugget: 1
    iron_ingot: 9
    gold_nugget: 2
    copper_ingot: 3
    gold_ingot: 18
    diamond: 60
    emerald: 10

storage:
  # Central storage: slots from the Town Hall level, plus warehouse containers.
  town-hall-slots-per-level: 27
  slots-per-container: 27
  # Granaries hold food only, at this many times the slots.
  granary-factor: 1.5
  # Extra capacity per building level above 1.
  level-bonus: 0.25
  # The armoury (tools, arms and armour as items).
  equipment-base-slots: 54
  armoury-slots-per-container: 27

simulation:
  # How often each colony's background simulation steps, and the time it may use per second (all colonies).
  step-seconds: 30
  step-budget-ms: 15
  # Most game hours caught up in one go (after a lag spike or a big jump in time).
  max-catch-up-hours: 48
  background-production: true
  # Days a building may fail its inspection before it's unregistered.
  invalid-building-grace-days: 2

health:
  # Daily chance a citizen falls ill (more when hungry, homeless or crowded).
  illness-chance: 0.01
  # Below this share of health a citizen counts as injured (no heavy work).
  injury-threshold: 0.4
  # Health a treatment with medicine restores.
  medicine-heal: 6

order:
  # Daily chance an unhappy, poor or idle citizen steals (less where guards watch).
  theft-chance: 0.04
  # Stability below which citizens protest (after protest-days) and riot.
  protest-below: 35
  riot-below: 15
  protest-days: 3
  # Citizens this miserable for this many days may leave.
  emigrate-below: 15
  emigrate-days: 3
  emigrate-chance: 0.5

military:
  # Soldiers a colony can keep without barracks (each barracks bed adds one).
  soldiers-without-barracks: 4
  # Training gained per hour of drill (1.0 is fully trained).
  training-per-hour: 0.02
  upkeep-multiplier: 1
  # Cost of enlisting a citizen.
  recruit-cost: 20
  mobilize-minutes: 10
  mobilize-cooldown-minutes: 20
  mobilize-stability-cost: 5

prisoners:
  # Chance a citizen (or traveller) goes down instead of dying in a fight.
  downed-chance: 0.3
  traveler-downed-chance: 1.0
  downed-seconds: 60
  # A prisoner's resistance to joining (wardens wear it down each day).
  resistance-min: 45
  resistance-max: 100
  persuasion-min: 8
  persuasion-max: 18
  # Days without food before a prisoner starves.
  starve-days: 5
  ransom-base: 40

travelers:
  enabled: true
  # Daily chance a traveller visits (more with a good reputation).
  chance-per-day: 0.6
  wait-minutes: 6
  reputation-start: 50
  attack-penalty: 5
  capture-penalty: 15
  recruit-bonus: 5
  # Paid to the treasury when a traveller stays at a staffed inn.
  lodging-fee: 6

war:
  # Minutes between the declaration and the fighting.
  warmup-minutes: 20
  siege-minutes: 45
  raid-minutes: 20
  # Where a siege's War Camp may stand, in blocks from the defender's land.
  camp-min-distance: 8
  camp-max-distance: 64
  # In a siege, how often the defenders' supply lines are checked and what being cut off costs.
  supply-check-seconds: 30
  supply-cut-stability: 5
  # Share of the loser's goods (and half that of their treasury's valuables) taken as spoils.
  spoils-fraction: 0.3
  # Share of a good raiders carry off every few seconds while standing at the defenders' storage.
  raid-loot-fraction: 0.05
  cooldown-minutes: 60
  # Members of the defending colony who must be online to declare a war.
  require-online-defenders: 1
  allow-offline-raids: false
  # Put back the blocks broken in a war once it's over.
  restore-blocks: true
  restore-delay-seconds: 120
  respawn-at-camp: true
  declare-cost: 50

diplomacy:
  # How long offers wait for an answer.
  proposal-minutes: 30
  truce-days: 3
  # Caravans between colonies take this long per chunk of distance.
  caravan-seconds-per-chunk: 2

blueprints:
  # Copies made with the wand.
  max-size: 48
  max-blocks: 20000
  max-per-colony: 10

mines:
  # Miners dig a staircase down to this depth, then a branch mine.
  target-y: 12
  tunnel-length: 32
  branch-length: 16
  max-per-colony: 3

quests:
  # Sent to storage when a colony finishes its first steps.
  reward: ["IRON_HOE:2", "IRON_AXE:1", "IRON_PICKAXE:1", "WHEAT_SEEDS:32", "CARROT:16", "BREAD:32", "OAK_LOG:32"]

raids:
  # Raiders from the wilds: barbarians after the stores, and now and then the dead behind a necromancer.
  # Scouts warn the colony in the morning; the raid comes at nightfall and ends at sunrise.
  # Raids only happen while a member is online and the colony is loaded, never in a peaceful world.
  enabled: true
  # A colony is left alone until it has this many citizens and is this many days old.
  min-population: 6
  grace-days: 5
  # Days of peace after a raid, and the chance of one on the first day after that (it grows by 8% each quiet day).
  min-days-between: 4
  chance-per-day: 0.25
  # Share of raids that are the undead rather than barbarians.
  undead-share: 0.35
  # Raid size grows with population, settlement level and raids already driven off, between these limits.
  min-size: 3
  max-size: 24
  # How far outside the colony's land raiders appear.
  spawn-distance: 14
  # A raid that drags on ends after this long even if the sun hasn't risen.
  max-minutes: 12
  # Paid into the treasury per raider killed when a raid is beaten.
  bounty-per-raider: 6
  # What barbarians take per head to stay away (/colony raid tribute).
  tribute-per-raider: 12
  # Barbarians standing at the colony's storage carry goods off (returned if every raider is killed).
  loot-storage: true

requests:
  # Citizens ask the players for things the stores lack; whoever brings them is paid from the citizen's purse.
  enabled: true
  max-open: 3
  chance-per-day: 0.7
  # Days a citizen waits before giving up, and days they work 15% faster after being answered.
  wait-days: 3
  motivated-days: 2

events:
  # Festivals, good growing weather, merchants' caravans, refugees, lucky strikes, strays, scholars and storms.
  # Only while a member is online.
  enabled: true
  min-days-between: 2
  chance-per-day: 0.4
  # How long a visiting merchant trades at the Town Hall.
  caravan-minutes: 8

milestones:
  enabled: true
  # Multiplies the treasury grants paid for milestones (0 = renown only).
  reward-multiplier: 1.0

christmas:
  # "auto" follows the calendar below, "always" keeps the season on all year, "never" turns it off.
  mode: auto
  # The season, month-day to month-day (it may run over the new year).
  from: "12-01"
  to: "01-06"
  # In-game days between Father Christmas's visits to a colony with a Christmas tree.
  father-christmas-days-between: 6

# ─────────────────────────────────────────────────────────────────────────────────────────────
# The living world: NPC civilisations with their own settlements, stores, rulers, trade and wars.
# Their economy is barter only. There is no money in it: a settlement's wealth is what is in its
# stores, and players trade ordinary Minecraft items with it, item for item.
# ─────────────────────────────────────────────────────────────────────────────────────────────
civilisations:
  enabled: true
  # Limits. Everything beyond these is simply not created.
  max-settlements: 24
  max-settlements-per-civilisation: 4
  max-citizens-per-settlement: 220
  # Most soldiers one settlement keeps under arms.
  max-military-units: 60
  # Villagers shown in settlements at once, across the whole server (a merchant and a few residents each).
  max-active-npcs: 40
  residents-per-settlement: 3
  # A settlement's villagers only exist while a player is within this many blocks.
  npc-activation-distance: 64
  # How often the server looks at the calendar. A world day is one Minecraft day; each takes about
  # 0.05 ms per settlement, wherever the settlement is and whether or not anyone is near it.
  simulation-interval-seconds: 5
  # Multipliers on what settlements make, how fast they grow, and how often something happens to them.
  production-rate: 1.0
  growth-rate: 1.0
  event-frequency: 1.0
  wars: true
  contracts: true
  max-contracts-per-player: 3
  # How far caravans go (blocks) and how far they travel in a day.
  trade-range: 2000
  caravan-blocks-per-day: 500
  # While the server is off the world moves on at this share of normal speed (a real 20 minutes = one
  # day), up to the limit. 0 freezes the world while the server is down.
  offline-rate: 0.25
  offline-days-max: 14
  # Who hears the news: "all" (everyone hears everything of note), "nearby" (the big things everywhere,
  # the rest only near where it happened), or "off". Nobody gets more than one line a minute.
  news: nearby
  # Players can't break, build, burn or blow up the buildings of a settlement.
  protect-settlements: true
  generation:
    enabled: true
    # Settlements only appear on land players have already explored, never in front of them.
    only-in-explored-chunks: true
    interval-seconds: 300
    # The map is divided into squares this many blocks across; each is considered once, for ever.
    spacing: 600
    # The share of squares that get a settlement, where the land allows.
    density: 0.4
    min-distance-from-spawn: 250
    min-distance-from-colonies: 160
    min-distance-from-players: 180
    # Worlds settlements may appear in (empty: the main overworld only).
    worlds: []
    # Places nothing may ever be generated near: "world,x,z,radius".
    avoid: []
  # Base worth of a trade good, to override the built-in table (see the README for the list).
  worth: {}

transactions:
  # "full": every trade survives a power cut as well as a crash (one disk flush per trade).
  # "normal": survives a server crash; a power cut may lose the last trades (never duplicate them).
  durability: full
  # A second click sooner than this is refused (double-clicks, held buttons, macros).
  min-milliseconds-between-trades: 250
  # Finished journal rows and audit notes older than this are deleted.
  keep-days: 90
  # When to leave a note for administrators (/colony audit). Notes are evidence, never punishment:
  # nobody is kicked, banned or blocked by them.
  audit:
    trades-per-minute: 30
    refusals-per-minute: 20
    net-worth-per-hour: 5000
