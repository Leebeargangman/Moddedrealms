# Moddedrealms Test Players
# Simulated players for performance testing: each one is a player-shaped mannequin that walks around,
# keeps the chunks around it loaded like a real player would, and can be driven by an AI model.
# They exist only on this server. They don't log in, have no Minecraft account and can't join other servers.

# Most test players allowed at once.
max-players: 200

# Chunks kept loaded (and ticking) around each test player, as a radius (1-16): 3 = a 7x7 square (49 chunks).
# A real player keeps roughly simulation-distance chunks ticking, so match your simulation-distance for
# realistic numbers. Overlapping test players share chunks.
chunk-radius: 3

# Movement speed in blocks per tick (a real player walks at about 0.22 and sprints at about 0.28).
walk-speed: 0.22
sprint-speed: 0.28

# Mobs, lava and players can't hurt test players. Set to false to test combat or deaths
# (a test player that dies comes back at its home spot after a few seconds).
invulnerable: true

# Look up the skin of the Minecraft account with the same name as the test player.
# Off by default: spawning 100 test players would mean 100 lookups at Mojang.
skin-from-name: false

# Put test players back where they were when the server restarts.
respawn-on-start: true

# Shown in front of everything a test player says in chat, so nobody mistakes it for a real player.
chat-prefix: "[Test] "

building:
  # Test players only build inside these zones, and never over blocks that are already there.
  # Add them in game with /testplayer zone add <name> <radius> (a square around you), or here as
  # name: "world,x1,z1,x2,z2". No zones = no building.
  zones: {}
  blocks-per-second: 3
  # Most structures one test player keeps (/testplayer undo <name> removes them).
  max-builds-per-player: 6
  # How long an AI test player waits after finishing a build before it may start another.
  cooldown-seconds: 120

survival:
  # Test players play survival: every block they place comes out of their inventory, crafted from what they
  # gathered (logs they chopped, stone they mined, wheat they harvested) or traded. Out of wood, a builder goes
  # and chops a tree. false = the old way, blocks from nowhere.
  enabled: true
  # true = builds an admin orders with /testplayer build (or the website) don't need materials.
  admin-builds-free: false
  # Explorers go through nether portals they find (or that you add with /testplayer town portal <town>).
  nether-trips: true
  # Right-click a test player to trade with it (what it really carries, for emeralds or swaps).
  trading: true

free:
  # Free players: test players that play survival like normal players (/testplayer spawn <name> <count> free|team,
  # /testplayer populate <count>, or keep-online below). No town needed: they start with nothing at spawn, make
  # tools, walk out and set up their own base, mine, hunt, explore, go to the nether and trade at spawn. Solo or
  # in small teams, and real players can team up with them (/teamup <name>).
  # Set up their own bases (a campfire, huts, a farm...) away from spawn, never near anything a player built.
  # false = they roam and never build.
  build-bases: true
  base-min-distance-from-spawn: 150
  # Keep this many free players on the server, joining at spawn like new players (0 = off).
  keep-online: 0
  # Those come and go like real players: they play for a while, log off, and come back later where they left off.
  sessions: true
  session-minutes-min: 40
  session-minutes-max: 150
  break-minutes-min: 20
  break-minutes-max: 120
  # Chance a newcomer starts a small team (2-4) that the next few newcomers join, instead of playing solo.
  team-chance: 0.4
  # New free players get their AI switched on when one is linked (/testplayer ai link). The API budget below
  # still decides how many actually use a paid API at once; the rest play on their own routines.
  ai-by-default: true
  # Real players can team up with free players (/teamup, or "<name> team up?" in chat).
  players-can-team-up: true
  # Teammates who teleport away (/home, /tpa) or get far ahead: their test players catch up, like a /tpa.
  companions-teleport: true
  # They fight off monsters going for their real teammates.
  fight-monsters: true
  # They hunt animals for food (never named, tame or penned-in ones).
  hunting: true
  # They get hungry and eat what they carry.
  hunger: true

ai:
  # Easiest: /testplayer ai link ... in game (it checks the link works, and asks for API keys in chat so they're
  # never typed in a command). Where test players with an AI think:
  #   ollama    - an Ollama this server can reach (ollama-url below). Free. Not available on Minehut.
  #   openai    - any OpenAI-compatible API: OpenAI, OpenRouter, Groq, Together... with a key, or a local
  #               server (LM Studio, llama.cpp: base-url on this machine or your network) with no key and no caps
  #   anthropic - Claude, with an Anthropic API key
  #   pc        - a staff member's own PC through the website (their connector, free): pc-staff below.
  #               That's how to use your own local models on Minehut.
  #   none      - no AI: test players play on their own routines
  # A test player given a staff member's name (/testplayer ai <name> on <staff>) always thinks on that person's PC.
  provider: ollama
  # provider pc: the staff member (their name on the website) whose PC does the thinking.
  pc-staff: ""
  # The model (empty = qwen2.5:3b for Ollama, claude-haiku-5-5 for Claude; OpenAI-style APIs need one set).
  model: ""
  ollama-url: "http://127.0.0.1:11434"
  # Seconds between decisions for each test player with AI.
  interval-seconds: 20
  # Most model requests at once, across all test players.
  max-concurrent: 2
  timeout-seconds: 90

  # Paid APIs (openai, anthropic). These limits can't be exceeded: when one is reached, test players carry on
  # with their own routines (working, exploring, trading) without the AI until the hour or day rolls over.
  api:
    # Your API key. Keep this file private. It is never shown in game, on the website or in logs.
    key: ""
    # For openai: the API's address (OpenRouter: https://openrouter.ai/api/v1, Groq: https://api.groq.com/openai/v1).
    base-url: "https://api.openai.com/v1"
    # Pause the API without losing the key: /testplayer api off
    enabled: true
    # Hard caps. Tokens are counted from what the API reports, and saved across restarts (ai-usage.yml).
    max-requests-per-hour: 120
    max-tokens-per-day: 200000
    # Longest answer, in tokens (a decision plus a chat line needs about 100-150).
    max-answer-tokens: 220
    # At most one request per test player this often.
    min-seconds-per-player: 60
    # Only this many test players use the API; the rest run on their own routines.
    max-players: 4
    # Optional: your API's prices, to also cap spending in dollars per day (0 = don't).
    price-per-million-input-tokens: 0
    price-per-million-output-tokens: 0
    max-dollars-per-day: 0

# Shows the test players on the Bots page of the website and lets staff control them from there,
# like the AI bot hosts (PC, VPS).
website:
  enabled: false
  url: "https://moddedrealms.net"
  # Same as BOT_MANAGER_KEY in the website's .env. Keep it secret!
  manager-key: ""
  # How this server is listed under "Hosts" on the Bots page (letters, numbers, . _ -).
  host-name: "testserver"
  # Where test players created on the Bots page appear: "world,x,y,z". Empty = the first world's spawn.
  spawn-at: ""
